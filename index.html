<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>50 Motivos de Amar a Sabrina 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      margin: 0;
      padding: 0;
      color: #fff;
      overflow-x: hidden;
      display: flex;
    }

    /* LADO ESQUERDO (FOTOS) */
    .lado-esquerdo {
      width: 40%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .lado-esquerdo img {
      width: 90%;
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }

    .lado-esquerdo img:hover {
      transform: scale(1.05);
    }

    /* LADO DIREITO (MOTIVOS) */
    .lado-direito {
      width: 60%;
      padding: 20px;
      overflow-y: auto;
      height: 100vh;
    }

    h1 {
      text-align: center;
    }

    .motivo {
      background: rgba(255,255,255,0.25);
      margin: 10px 0;
      padding: 15px;
      border-radius: 20px;
      transition: 0.2s;
    }

    .motivo:hover {
      transform: scale(1.03);
    }

    .botao {
      display: block;
      margin: 20px auto;
      padding: 12px 20px;
      border-radius: 20px;
      border: none;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
    }

    .mensagem {
      text-align: center;
      opacity: 0;
      transition: 0.5s;
      font-size: 1.4em;
    }

    .mostrar { opacity: 1; }

    /* CORAÇÕES */
    .heart {
      position: fixed;
      width: 15px;
      height: 15px;
      background: red;
      transform: rotate(45deg);
      animation: float 6s infinite;
    }

    .heart::before, .heart::after {
      content: '';
      width: 15px;
      height: 15px;
      background: red;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before { top: -7px; }
    .heart::after { left: -7px; }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(45deg); opacity:1; }
      100% { transform: translateY(-10vh) rotate(45deg); opacity:0; }
    }

  </style>
</head>
<body>

<!-- ESQUERDA -->
<div class="lado-esquerdo">
  <img src="foto1.jpg" alt="Foto 1">
  <img src="foto2.jpg" alt="Foto 2">
</div>

<!-- DIREITA -->
<div class="lado-direito">
  <h1>💖 50 Motivos de Amar a Sabrina 💖</h1>

  <button class="botao" onclick="mostrarMensagem()">Clique aqui 💘</button>
  <div class="mensagem" id="msg">Eu te amo infinitamente Sabrina 💖</div>

  <div id="lista"></div>
</div>

<script>
const motivos = [
  "Seu sorriso ilumina meu mundo ✨",
  "Seu jeitinho é perfeito 🥰",
  "Seu olhar é lindo 💖",
  "Sua risada é minha favorita 😄",
  "Você é incrível 😍",
  "Seu coração é gigante 💕",
  "Você me faz feliz",
  "Seu abraço é perfeito 🤗",
  "Você é única",
  "Seu jeitinho fofo",
  "Sua voz acalma",
  "Você é especial",
  "Seu cuidado comigo",
  "Você me entende",
  "Você é divertida",
  "Seu charme",
  "Seu carinho",
  "Você é inteligente",
  "Seu bom humor",
  "Você é minha paz",
  "Seu jeito de rir",
  "Você é perfeita pra mim",
  "Seu olhar sincero",
  "Você me inspira",
  "Seu amor",
  "Você é tudo",
  "Seu jeito doce",
  "Você me completa",
  "Você é linda",
  "Seu abraço me acalma",
  "Você é meu sonho",
  "Seu cuidado",
  "Você é maravilhosa",
  "Seu jeito especial",
  "Você me faz sorrir",
  "Você é minha felicidade",
  "Seu carinho diário",
  "Você é incrível comigo",
  "Seu amor verdadeiro",
  "Você é minha pessoa favorita",
  "Seu jeito de amar",
  "Você é perfeita",
  "Seu sorriso me ganha",
  "Você é meu mundo",
  "Seu jeito único",
  "Você é inesquecível",
  "Seu coração lindo",
  "Você é minha vida",
  "Seu amor me fortalece",
  "Eu amo tudo em você"
];

const lista = document.getElementById('lista');
motivos.forEach((m,i)=>{
  const div=document.createElement('div');
  div.className='motivo';
  div.innerHTML=`❤️ ${i+1}. ${m}`;
  lista.appendChild(div);
});

function mostrarMensagem(){
  document.getElementById('msg').classList.add('mostrar');
}

setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart';
  h.style.left=Math.random()*100+'vw';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},200);
</script>

</body>
</html>
