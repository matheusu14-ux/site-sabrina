<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>50 Motivos de Amar a Sabrina 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    h1 { margin-top: 40px; }
    .galeria img {
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      margin: 10px;
    }
    .motivo {
      background: rgba(255,255,255,0.25);
      margin: 10px;
      padding: 15px;
      border-radius: 20px;
    }
    .botao {
      margin: 20px;
      padding: 12px 20px;
      border-radius: 20px;
      border: none;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
    }
    .mensagem { opacity: 0; transition: 0.5s; }
    .mostrar { opacity: 1; }
    .heart {
      position: fixed;
      width: 15px;
      height: 15px;
      background: red;
      transform: rotate(45deg);
      animation: float 6s infinite;
    }
    .heart::before, .heart::after {
      content: '';
      width: 15px;
      height: 15px;
      background: red;
      border-radius: 50%;
      position: absolute;
    }
    .heart::before { top: -7px; }
    .heart::after { left: -7px; }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(45deg); opacity:1;}
      100% { transform: translateY(-10vh) rotate(45deg); opacity:0;}
    }
  </style>
</head>
<body>

<h1>💖 50 Motivos de Amar a Sabrina 💖</h1>

<div class="galeria">
  <img src="foto1.jpg">
  <img src="foto2.jpg">
</div>

<button class="botao" onclick="mostrarMensagem()">Clique aqui 💘</button>
<div class="mensagem" id="msg">Eu te amo infinitamente Sabrina 💖</div>

<div id="lista"></div>

<script>
const motivos = Array.from({length:50}, (_,i)=>`Motivo ${i+1}: Porque você é perfeita 💖`);
const lista = document.getElementById('lista');
motivos.forEach(m=>{
  const div = document.createElement('div');
  div.className='motivo';
  div.innerHTML=m;
  lista.appendChild(div);
});
function mostrarMensagem(){
  document.getElementById('msg').classList.add('mostrar');
}
setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart';
  h.style.left=Math.random()*100+'vw';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},200);
</script>

</body>
</html>
